<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Set the theme before paint to avoid a flash. Defaults to dark. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('vault876-theme')
          document.documentElement.classList.toggle('dark', t !== 'light')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Unapologetically luxurious. Expertly crafted. Book your appointment at Vault 876, Aylesbury's premier hair and beauty salon."
    />
    <!-- Obsidian mobile browser chrome -->
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Open Graph / WhatsApp / Facebook link preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vault 876" />
    <meta property="og:title" content="Vault 876 | Luxury Hair & Beauty" />
    <meta
      property="og:description"
      content="Unapologetically luxurious. Expertly crafted. Book your appointment at Vault 876."
    />
    <meta property="og:url" content="https://vault876.boanetworks.com" />
    <meta
      property="og:image"
      content="https://vault876.boanetworks.com/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Vault 876 — Luxury Hair & Beauty, Aylesbury"
    />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vault 876 | Luxury Hair & Beauty" />
    <meta
      name="twitter:description"
      content="Unapologetically luxurious. Expertly crafted. Book your appointment at Vault 876."
    />
    <meta
      name="twitter:image"
      content="https://vault876.boanetworks.com/og-image.jpg"
    />

    <!-- Fonts: Playfair Display (warm high-contrast display serif) + Montserrat
         (heavy poster sans for service names) + Inter (UI sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..700&family=Montserrat:wght@500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <title>Vault 876 | Luxury Hair &amp; Beauty</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
